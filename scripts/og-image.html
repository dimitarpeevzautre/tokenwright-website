<!doctype html>
<!-- Source for public/og-image.png. Open in a browser at a 1200x630 viewport
     and screenshot it to regenerate the image. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px; height: 630px; box-sizing: border-box; padding: 72px 80px;
      background: #FBFAF8; color: #1A1A1A;
      display: flex; flex-direction: column; justify-content: space-between;
      font-family: "Spectral", Georgia, serif;
    }
    .brand { display: flex; align-items: center; gap: 28px; font-size: 64px; font-weight: 500; letter-spacing: -0.01em; }
    .brand img { width: 132px; height: 96px; display: block; }
    h1 { margin: 0; font-size: 68px; line-height: 1.12; font-weight: 400; letter-spacing: -0.015em; max-width: 960px; }
    .foot {
      font-family: "IBM Plex Mono", monospace; font-size: 22px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase; color: #5C5750;
      display: flex; align-items: center; gap: 14px;
    }
    .dot { width: 12px; height: 12px; background: #E8B500; display: inline-block; }
  </style>
</head>
<body>
  <div class="brand"><img src="../public/assets/tokenwright-mark.svg" alt="" />Tokenwright</div>
  <h1>Managed Tokens for Salesforce Commerce Cloud</h1>
  <div class="foot"><span class="dot"></span>tokenwright.com</div>
</body>
</html>
