<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Old hash URLs (#/pricing, #/#waitlist) redirect to the real paths. -->
  <script>
    (function () {
      function redirect() {
        var h = window.location.hash;
        if (h.indexOf("#/") !== 0) return;
        var parts = h.slice(1).split("#");
        var path = parts[0].replace(/\/+$/, "") + "/";
        window.location.replace(path + (parts[1] ? "#" + parts[1] : ""));
      }
      redirect();
      window.addEventListener("hashchange", redirect);
    })();
  </script>
  <!--app-head-->

  <!-- Fonts: Spectral + Hanken Grotesk + IBM Plex Mono (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-180.png" />
</head>

</body>
</html>
